# SonarQube-Analyse-Konfiguration für heron
# Scan: nix shell nixpkgs#sonar-scanner-cli -c sonar-scanner \
#         -Dsonar.host.url=http://localhost:9000 -Dsonar.login=$SONAR_TOKEN
sonar.projectKey=heron
sonar.projectName=heron

# Quellen: eigener Go-Code (kein vendor/)
sonar.sources=main.go,cmd,internal,examples
sonar.exclusions=**/*_test.go

# Tests (liegen in Go neben den Quellen)
sonar.tests=internal
sonar.test.inclusions=**/*_test.go

sonar.sourceEncoding=UTF-8
